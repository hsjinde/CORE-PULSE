name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test-build:
    name: Lint / Test / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      # npm test 的 script 內已含 node scripts/gen-wiki.cjs,不需要額外的 gen-wiki step
      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: lint-test-build
    # PR 上也跑。無障礙掃描(e2e/a11y*.spec.ts)是防「對比度 / 焦點環回歸」的閘門,
    # 只在合併之後才跑等於攔不到 —— 淺色模式那次事故正是無聲地進了 main。
    #
    # 仍然刻意不掛進 deploy 的 needs:PR 上紅了是給人看的訊號,還不讓它有權擋住上線。
    # 等這批在 PR 上跑穩了(沒有偶發失敗),再把它加進 deploy 的 needs。
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # wrangler pages dev 會打包 functions/,而 chat-wiki.ts import './_wiki-gen'
      # ——這個檔案是 git-ignored 的產生物,不先生成 Functions bundle 會建不起來。
      - name: Generate wiki for Functions
        run: node scripts/gen-wiki.cjs

      # 需要真實 LLM 金鑰的 ask 測試會自行 skip(見 e2e/ask.spec.ts 的 E2E_LLM 旗標)
      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: lint-test-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Generate wiki for Functions
        run: node scripts/gen-wiki.cjs

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy dist/ --project-name=core-pulse --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # - name: Purge Cloudflare Cache
      #   run: |
      #     curl -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
      #       -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
      #       -H "Content-Type: application/json" \
      #       --data '{"purge_everything":true}'
