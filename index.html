<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Ethan | Security Software Engineer</title>
    <meta name="description" content="Ethan（林晉德）- 資安軟體工程師。專注 CVE 弱點研究與防毒軟體開發，工作之外自架郵件系統、LLM 代理與 Cloudflare 邊緣架構。IEEE Access 論文作者。" />
    <meta name="keywords" content="Ethan, hsjinde, Security, CVE, RNN, SPARQL, AI, Cloudflare, Docker, Self-Hosted, React" />
    <link rel="canonical" href="https://19980803.xyz/" />

    <!-- Open Graph / Twitter Card
         這一整組是「首頁的預設值」,同時也是 functions/_middleware.ts 的覆寫目標:
         /blog/:id 由 middleware 用 HTMLRewriter 把下面每一個 content 換成該篇文章的值。
         middleware 只改屬性、不新增標籤,所以想讓爬蟲看到某個欄位,它就必須先出現在這裡。 -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CORE PULSE" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:title" content="Ethan | Security Software Engineer" />
    <meta property="og:description" content="Security software engineer. CVE research by day, self-hosted infrastructure by night." />
    <meta property="og:url" content="https://19980803.xyz/" />
    <meta property="og:image" content="https://19980803.xyz/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="CORE PULSE — Ethan, Security Software Engineer" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ethan | Security Software Engineer" />
    <meta name="twitter:description" content="CVE research by day, self-hosted infrastructure by night." />
    <meta name="twitter:image" content="https://19980803.xyz/og-default.png" />

    <!-- JSON-LD:Person。
         type 不是 JavaScript MIME,瀏覽器把它當 data block 而非 script 來處理,
         所以不會走 CSP script-src 的檢查(這點是在 wrangler pages dev 上帶著
         public/_headers 的真實 CSP 實測過的,不是照規格推論)。
         文章頁的 BlogPosting 由 middleware 另外 append,兩個並存是合法的。 -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Ethan Lin",
        "alternateName": "林晉德",
        "url": "https://19980803.xyz/",
        "image": "https://19980803.xyz/og-default.png",
        "jobTitle": "Security Software Engineer",
        "description": "Security software engineer. CVE research by day, self-hosted infrastructure by night.",
        "knowsAbout": ["CVE Research", "Site Reliability Engineering", "LLM Agent Infrastructure", "Cloudflare Workers", "Self-Hosted Infrastructure"],
        "sameAs": [
          "https://github.com/hsjinde",
          "https://www.linkedin.com/in/%E6%99%89%E5%BE%B7-%E6%9E%97-99421a237/"
        ]
      }
    </script>

    <!-- Security -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="DENY" />

    <!-- Theme bootstrap — 必須同步執行且早於任何樣式，否則會先畫深色再跳淺色(FOUC)。
         單一事實來源:localStorage['theme'] 有值就聽它,沒有就跟隨系統。
         index.css 的 token 只認 [data-theme],不另設 @media fallback —— JS 關閉時
         停在深色(等同改版前的行為),是安全的降級。

         實作放在 /theme-init.js 而不是這裡的 inline <script>:public/_headers 的
         CSP 是 script-src 'self',沒有 'unsafe-inline',inline 版本在 Pages 上
         從來沒執行過(淺色模式因此整組是死的)。外部檔走 'self',不需要 hash —— hash
         對空白改動敏感,壞掉時同樣是無聲失效。
         注意:不可加 defer / type="module",那會延到 CSS 之後才跑,FOUC 又回來。 -->
    <script src="/theme-init.js"></script>

    <!-- Performance hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <!-- Fonts — loaded here (not via a CSS @import) so the request starts immediately,
         parallel with the preconnect above, instead of waiting on index.css to download
         and parse first. display=swap keeps text visible during load; CSP-safe (style-src). -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
